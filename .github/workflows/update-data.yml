name: Update dashboard data

# Runs daily and on manual trigger. Fetches the latest figures and commits
# data.json if anything changed. With GitHub Pages set to "Deploy from a
# branch" (main / root), each commit automatically republishes the dashboard.

on:
  schedule:
    # Three attempts spread across the day — if the BPS API is down in one
    # window, a later run catches the new data. Runs are idempotent (the date
    # only advances on a successful BPS fetch), so this adds no noise commits.
    - cron: "17 1 * * *"    # 01:17 UTC (~08:17 WIB)
    - cron: "17 7 * * *"    # 07:17 UTC (~14:17 WIB)
    - cron: "17 13 * * *"   # 13:17 UTC (~20:17 WIB)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: python update_dashboard.py --verbose

      - name: Commit data.json if it changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: auto-update dashboard data ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No data changes today."
          fi

      # Fails the job (→ GitHub emails the repo owner) only when the data has
      # been stale for several days — i.e. a sustained BPS outage or a broken
      # fetch, not a single transient hiccup. This is the early-warning system.
      - name: Alert if data is stale
        run: |
          python - <<'PY'
          import json, datetime as dt, sys
          meta = json.load(open("data.json")).get("meta", {})
          gen = meta.get("generated_at", "")
          try:
              age = (dt.date.today() - dt.date.fromisoformat(gen)).days
          except Exception:
              age = 999
          print(f"Data age: {age} day(s) (generated_at={gen})")
          if age > 3:
              print(f"::error::Dashboard data is stale ({age} days). "
                    f"BPS fetch is likely failing — check the workflow logs.")
              sys.exit(1)
          PY
